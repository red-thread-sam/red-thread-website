<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Thread Email Signature</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff;">
  <!-- Copy from the table below into Gmail → Settings → Signature -->
  <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="max-width:450px; border-collapse:collapse; font-family:Arial, Helvetica, sans-serif;">
    <tr>
      <!-- Logo -->
      <td valign="middle" style="padding:0 16px 0 0; vertical-align:middle;">
        <img
          src="https://redthread.co/assets/logo-gradient.gif"
          alt="Red Thread"
          width="48"
          height="48"
          style="display:block; border:0; outline:none; text-decoration:none; width:48px; height:48px;"
        />
      </td>
      <!-- Divider + details -->
      <td valign="middle" style="padding:0 0 0 16px; border-left:1px solid #E5E5E5; vertical-align:middle;">
        <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse; font-family:Arial, Helvetica, sans-serif;">
          <tr>
            <td style="padding:0 0 2px 0; font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:bold; line-height:1.35; color:#111111;">
              Your Name
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 2px 0; font-family:Arial, Helvetica, sans-serif; font-size:13px; font-weight:normal; line-height:1.35; color:#666666;">
              Your Title
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 8px 0; font-family:Arial, Helvetica, sans-serif; font-size:13px; font-weight:normal; line-height:1.35; color:#111111;">
              Red Thread Creative Ltd
            </td>
          </tr>
          <tr>
            <td style="padding:0; font-family:Arial, Helvetica, sans-serif; font-size:12px; font-weight:normal; line-height:1.4; color:#666666;">
              <a href="https://redthread.co" style="color:#666666; text-decoration:none;">Website</a>
              <span style="color:#CCCCCC;">&nbsp;|&nbsp;</span>
              <a href="https://redthread.co/privacy.html" style="color:#666666; text-decoration:none;">Privacy Policy</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
